<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexillo-Every flag tells a story</title>
    <!-- Fonts: Cinzel Decorative (artistic title), Dancing Script (handwritten tagline),
         Figtree (normal text) -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@600;700&family=Figtree:wght@400;600;700&display=swap">
    <link rel="icon" href="images/compass-logo.png" type="image/png">

    <!-- Tailwind CSS (browser version, no build step needed) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="min-h-screen bg-white font-['Figtree'] text-slate-900">
    <!-- Background picture: covers the whole screen, stays still when scrolling,
         keeps the landmarks in view (bg-bottom), sits behind everything (-z-10).
         opacity-20 + grayscale = a soft, faint watermark that does not distract from the content -->
    <div class="fixed inset-0 -z-10 bg-[url('images/background.png')] bg-cover bg-bottom bg-no-repeat opacity-20 grayscale"
        aria-hidden="true"></div>

    <!-- Animated compass: fixed at the right, halfway down the screen (top-1/2 -translate-y-1/2).
         Shown only on wide screens (hidden xl:block) so it never covers the boxes. -->
    <img src="images/compass.gif" alt="" aria-hidden="true"
        class="pointer-events-none fixed right-6 top-1/2 hidden w-28 -translate-y-1/2 drop-shadow-xl xl:block 2xl:right-12 2xl:w-40">

    <!-- ========== HEADER + NAV BAR ========== -->
    <!-- sticky: stays at the top when scrolling. bg-blue-950 = solid navy blue (no transparency),
         shadow-2xl shadow-black/70 = a big, strong dark shadow below the bar -->
    <header class="sticky top-0 z-10 bg-blue-950 text-white shadow-2xl shadow-black/70">
        <nav class="mx-auto flex max-w-6xl flex-col items-center gap-4 px-4 py-4 md:flex-row md:justify-between">

            <!-- Brand: title and tagline -->
            <a href="index.html" class="flex items-center gap-3 text-center md:text-left">
                <!-- Logo: brass compass (a small copy of compass_edited.png) -->
                <img src="images/compass-logo.png" alt="" class="h-16 w-16 md:h-20 md:w-20">
                <div>
                <h1 class="font-['Cinzel_Decorative'] text-4xl font-black tracking-wide text-white md:text-5xl">
                    Vexillo
                </h1>
                <h2 class="font-['Dancing_Script'] text-2xl font-bold text-red-400 md:text-3xl">
                    Every flag tells a story
                </h2>
                </div>
            </a>

            <!-- Menu links -->
            <ul class="flex flex-wrap justify-center gap-6 font-semibold">
                <li><a href="index.html" class="text-white underline decoration-red-400 decoration-2 underline-offset-8">Home</a></li>
                <li><a href="#search" class="hover:text-red-400">Search</a></li>
                <li><a href="#flags" class="hover:text-red-400">All Flags</a></li>
                <li><a href="#regions" class="hover:text-red-400">Regions</a></li>
                <li><a href="#favourites" class="hover:text-red-400">Favourites</a></li>
            </ul>
        </nav>
    </header>

    <!-- mx-auto max-w-5xl keeps everything in the centre of the screen -->
    <main class="mx-auto max-w-5xl px-4 py-10">

        <!-- ========== SEARCH ========== -->
        <!-- mt-8 = moves the search bar a little further down from the nav bar -->
        <section id="search" class="mt-8 mb-8">
            <form id="search-form" class="mx-auto flex max-w-xl gap-3">
                <input id="search-input" type="text" placeholder="Type a country, e.g. India" required
                    class="flex-1 rounded-full border border-slate-300 bg-white px-5 py-3 shadow-sm outline-none focus:border-blue-900 focus:ring-2 focus:ring-blue-900/30">
                <button type="submit"
                    class="rounded-full bg-blue-900 px-6 py-3 font-semibold text-white shadow hover:bg-red-600">Search</button>
            </form>
            <!-- error message, e.g. "Country not found" (hidden until JavaScript shows it) -->
            <p id="search-message" class="mt-3 hidden text-center font-semibold text-red-600"></p>
        </section>

        <!-- ========== RESULT: 2 boxes ==========
             grid: 1 column on phones, 2 columns side by side from tablet size (md).
             mt-16 = extra space above the boxes -->
        <section id="result" class="mt-16 grid gap-6 md:grid-cols-2">

            <!-- Box 1: the flag -->
            <article class="flex items-center justify-center rounded-2xl bg-slate-100 p-6 shadow-lg">
                <img id="flag-img" src="" alt="Flag of the searched country"
                    class="hidden max-h-72 w-full rounded-lg object-contain shadow">
                <p id="flag-placeholder" class="text-slate-500">The flag will appear here</p>
            </article>

            <!-- Box 2: details about the country -->
            <article class="rounded-2xl bg-slate-100 p-6 shadow-lg">
                <!-- uppercase: shows the name in CAPITAL letters, whatever the API sends -->
                <h3 id="country-name" class="mb-1 text-3xl font-bold uppercase tracking-wide text-blue-900">Country name</h3>
                <p id="country-official" class="mb-5 text-slate-600">Official name</p>

                <dl class="grid grid-cols-[auto_1fr] gap-x-6 gap-y-3">
                    <dt class="font-semibold">Capital</dt>
                    <dd id="country-capital">—</dd>

                    <dt class="font-semibold">Region</dt>
                    <dd id="country-region">—</dd>

                    <dt class="font-semibold">Subregion</dt>
                    <dd id="country-subregion">—</dd>

                    <dt class="font-semibold">Population</dt>
                    <dd id="country-population">—</dd>

                    <dt class="font-semibold">Codes</dt>
                    <dd id="country-codes">—</dd>

                    <dt class="font-semibold">Borders</dt>
                    <dd id="country-borders">—</dd>
                </dl>
            </article>

        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
