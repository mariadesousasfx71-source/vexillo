<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexillo-Every flag tells a story</title>
    <!-- Fonts: Cinzel Decorative (artistic title), Dancing Script (handwritten tagline),
         Figtree (normal text) -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@600;700&family=Figtree:wght@400;600;700&display=swap">
    <link rel="icon" href="images/compass-logo.png" type="image/png">

    <!-- Tailwind CSS (browser version, no build step needed) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<!-- bg-[#060d20] = a plain, very dark navy outside the page container -->
<body class="min-h-screen overflow-x-hidden bg-[#060d20] font-['Figtree'] text-slate-900">
    <!-- ========== PAGE CONTAINER ==========
         Holds everything on the page. max-w-7xl = no wider than a laptop screen (1280px),
         mx-auto = centred, relative = the background and compass are placed inside this box,
         min-h-screen = full height, overflow-clip = nothing spills outside the box
         (overflow-clip, not overflow-hidden, so the sticky nav bar still works). -->
    <div class="relative mx-auto min-h-screen max-w-7xl overflow-clip shadow-2xl shadow-black/60">

    <!-- Background picture: fills ONLY this page container (absolute inset-0), not the whole screen.
         opacity-45 over the navy page colour; bg-center keeps the signpost in view;
         blur-[1px] softens it slightly; scale-105 hides the blurred edges -->
    <div class="absolute inset-0 -z-10 scale-105 bg-[url('images/background.png')] bg-cover bg-center bg-no-repeat opacity-45 blur-[1px]"
        aria-hidden="true"></div>

    <!-- Navy fade inside the container: clear at the top, darker towards the bottom.
         bg-linear-to-b = a gradient from top to bottom. -->
    <div class="absolute inset-0 -z-[9] bg-linear-to-b from-transparent via-[#0a1633]/30 to-[#0a1633]/85"
        aria-hidden="true"></div>

    <!-- Animated compass: compass-half.gif is the compass tilted to the right and cut in half,
         so it peeks in from the right edge without its hook.
         right-0 = touches the right edge of the page container; top-[50vh] -translate-y-1/2 = middle of the screen.
         -z-[5] = in front of the watermark but behind the boxes. Only on wide screens (hidden xl:block).
         opacity-40 = 40% visible; drop-shadow-[...] = a dark shadow down and to the left of the compass. -->
    <img src="images/compass-half.gif" alt="" aria-hidden="true"
        class="pointer-events-none absolute right-0 top-[50vh] -z-[5] hidden w-[224px] -translate-y-1/2 opacity-40 drop-shadow-[-14px_14px_18px_rgba(0,0,0,0.9)] xl:block 2xl:w-[288px]">

    <!-- ========== HEADER + NAV BAR ========== -->
    <!-- RESPONSIVE: phones = not sticky (the header is tall there); md:sticky = sticks to the top from tablet size.
         bg-[#0a1633] = the same dark navy as the boxes,
         shadow-2xl shadow-black/70 = a big, strong dark shadow below the bar -->
    <header class="relative z-10 bg-[#0a1633] md:sticky md:top-0 text-white shadow-2xl shadow-black/70">
        <nav class="mx-auto flex max-w-6xl flex-col items-center gap-3 px-4 py-3 md:flex-row md:justify-between md:gap-4 md:py-4">

            <!-- Brand: title and tagline -->
            <a href="index.html" class="flex items-center gap-3 text-center md:text-left">
                <!-- Logo: brass compass (a small copy of compass_edited.png) -->
                <img src="images/compass-logo.png" alt="" class="h-12 w-12 sm:h-16 sm:w-16 md:h-20 md:w-20">
                <div>
                <h1 class="font-['Cinzel_Decorative'] text-3xl font-black tracking-wide text-white sm:text-4xl md:text-5xl">
                    Vexillo
                </h1>
                <h2 class="font-['Dancing_Script'] text-xl font-bold sm:text-2xl text-red-400 md:text-3xl">
                    Every flag tells a story
                </h2>
                </div>
            </a>

            <!-- Menu links -->
            <ul class="flex flex-wrap justify-center gap-x-5 gap-y-2 text-sm font-semibold sm:gap-x-6 sm:text-base">
                <li><a href="index.html" class="text-white underline decoration-red-400 decoration-2 underline-offset-8">Home</a></li>
                <li><a href="#search" class="hover:text-red-400">Search</a></li>
                <li><a href="#flags" class="hover:text-red-400">All Flags</a></li>
                <li><a href="#regions" class="hover:text-red-400">Regions</a></li>
                <li><a href="#favourites" class="hover:text-red-400">Favourites</a></li>
            </ul>
        </nav>

        <!-- Golden rope along the bottom: thin diagonal stripes in light, mid and dark gold
             (repeating-linear-gradient) look like twisted rope strands -->
        <div aria-hidden="true"
            class="h-2.5 bg-[repeating-linear-gradient(135deg,#fde68a_0_3px,#f59e0b_3px_7px,#92400e_7px_10px)] shadow-[inset_0_1px_1px_rgba(255,255,255,0.4),inset_0_-1px_1px_rgba(0,0,0,0.5)]">
        </div>
    </header>

    <!-- mx-auto max-w-5xl keeps everything in the centre of the screen -->
    <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6 md:py-10">

        <!-- ========== SEARCH ========== -->
        <!-- mt-8 = moves the search bar a little further down from the nav bar -->
        <section id="search" class="mt-4 mb-8 md:mt-8">
            <form id="search-form" class="mx-auto flex max-w-xl gap-3">
                <input id="search-input" type="text" placeholder="Type a country, e.g. India" required
                    class="min-w-0 flex-1 rounded-full border border-slate-300 bg-white px-5 py-3 shadow-sm outline-none focus:border-blue-900 focus:ring-2 focus:ring-blue-900/30">
                <button type="submit"
                    class="shrink-0 rounded-full bg-blue-900 px-5 py-3 font-semibold sm:px-6 text-white shadow hover:bg-red-600">Search</button>
            </form>
            <!-- error message, e.g. "Country not found" (hidden until JavaScript shows it) -->
            <p id="search-message" class="mt-3 hidden text-center font-semibold text-red-300"></p>
        </section>

        <!-- ========== RESULT: 2 boxes ==========
             grid: 1 column on phones, 2 columns side by side from tablet size (md).
             mt-8 on phones, md:mt-16 = more space above the boxes on bigger screens -->
        <section id="result" class="mt-8 grid gap-6 md:mt-16 md:grid-cols-2">

            <!-- Sailor-uniform style boxes: dark navy fill (bg-[#0a1633]) with a gold border (border-amber-400)
                 and a thin inner gold line like uniform piping (outline + -outline-offset-8). -->

            <!-- Box 1: the flag -->
            <article class="flex min-h-48 items-center justify-center rounded-2xl p-5 sm:p-8 md:min-h-72 border-2 border-amber-400 bg-[#0a1633] shadow-xl shadow-black/50 outline-1 outline-amber-400/40 -outline-offset-8">
                <img id="flag-img" src="" alt="Flag of the searched country"
                    class="hidden max-h-72 w-full rounded-lg object-contain shadow">
                <p id="flag-placeholder" class="text-slate-300">The flag will appear here</p>
            </article>

            <!-- Box 2: details about the country -->
            <article class="rounded-2xl p-5 sm:p-8 text-white border-2 border-amber-400 bg-[#0a1633] shadow-xl shadow-black/50 outline-1 outline-amber-400/40 -outline-offset-8">
                <!-- uppercase: shows the name in CAPITAL letters, whatever the API sends -->
                <h3 id="country-name" class="mb-1 break-words text-2xl font-bold uppercase sm:text-3xl tracking-wide text-amber-300">Country name</h3>
                <p id="country-official" class="mb-5 text-slate-300">Official name</p>

                <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-3 break-words sm:gap-x-6">
                    <dt class="font-semibold text-amber-300">Capital</dt>
                    <dd id="country-capital">—</dd>

                    <dt class="font-semibold text-amber-300">Region</dt>
                    <dd id="country-region">—</dd>

                    <dt class="font-semibold text-amber-300">Subregion</dt>
                    <dd id="country-subregion">—</dd>

                    <dt class="font-semibold text-amber-300">Population</dt>
                    <dd id="country-population">—</dd>

                    <dt class="font-semibold text-amber-300">Codes</dt>
                    <dd id="country-codes">—</dd>

                    <dt class="font-semibold text-amber-300">Borders</dt>
                    <dd id="country-borders">—</dd>
                </dl>
            </article>

        </section>
    </main>

    </div>
    <!-- ========== END PAGE CONTAINER ========== -->

    <script src="app.js"></script>
</body>

</html>
