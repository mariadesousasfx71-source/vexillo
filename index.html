<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexillo-Every flag tells a story</title>
    <!-- Fonts: Cinzel Decorative (artistic title), Dancing Script (handwritten tagline),
         Figtree (normal text) -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@600;700&family=Figtree:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/compass-logo.png" type="image/png">

    <!-- Tailwind CSS (browser version, no build step needed) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="min-h-screen bg-white font-['Figtree'] text-slate-900">
    <!-- Background picture: covers the whole screen, stays still when scrolling,
         keeps the landmarks in view (bg-bottom), sits behind everything (-z-10) and is see-through (opacity-50 = 50% visible) -->
    <div class="fixed inset-0 -z-10 bg-[url('images/background.png')] bg-cover bg-bottom bg-no-repeat opacity-50"
        aria-hidden="true"></div>

    <!-- ========== HEADER + NAV BAR ========== -->
    <!-- sticky: stays at the top when scrolling. bg-white/70 = white at 70%, backdrop-blur blurs the picture behind it -->
    <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/70 backdrop-blur">
        <nav class="mx-auto flex max-w-6xl flex-col items-center gap-4 px-4 py-4 md:flex-row md:justify-between">

            <!-- Brand: title and tagline -->
            <a href="index.html" class="flex items-center gap-3 text-center md:text-left">
                <!-- Logo: brass compass (a small copy of compass_edited.png) -->
                <img src="images/compass-logo.png" alt="" class="h-16 w-16 md:h-20 md:w-20">
                <div>
                <h1 class="font-['Cinzel_Decorative'] text-4xl font-black tracking-wide text-blue-900 md:text-5xl">
                    Vexillo
                </h1>
                <h2 class="font-['Dancing_Script'] text-2xl font-bold text-red-600 md:text-3xl">
                    Every flag tells a story
                </h2>
                </div>
            </a>

            <!-- Menu links -->
            <ul class="flex flex-wrap justify-center gap-6 font-semibold">
                <li><a href="index.html" class="text-blue-900 underline decoration-red-600 decoration-2 underline-offset-8">Home</a></li>
                <li><a href="#search" class="hover:text-red-600">Search</a></li>
                <li><a href="#flags" class="hover:text-red-600">All Flags</a></li>
                <li><a href="#regions" class="hover:text-red-600">Regions</a></li>
                <li><a href="#favourites" class="hover:text-red-600">Favourites</a></li>
            </ul>
        </nav>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-10">
        <!-- page content goes here -->
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
