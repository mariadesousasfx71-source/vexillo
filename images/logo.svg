<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vexillo logo">
  <!-- Globe -->
  <circle cx="30" cy="36" r="22" fill="#eff6ff" stroke="#1e3a8a" stroke-width="3"/>
  <!-- Meridians and parallels -->
  <ellipse cx="30" cy="36" rx="10" ry="22" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.55"/>
  <line x1="8" y1="36" x2="52" y2="36" stroke="#1e3a8a" stroke-width="1.5" opacity="0.55"/>
  <path d="M11 26 H49 M11 46 H49" stroke="#1e3a8a" stroke-width="1.5" opacity="0.55"/>
  <!-- Compass needle: red points north, blue points south -->
  <polygon points="30,19 34.5,36 25.5,36" fill="#dc2626"/>
  <polygon points="30,53 34.5,36 25.5,36" fill="#1e3a8a"/>
  <circle cx="30" cy="36" r="2.6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <!-- Flag on a pole rising from the top of the globe -->
  <line x1="44" y1="21" x2="44" y2="3" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44 4 C49 1.5 53 6.5 60 4 L60 14 C53 16.5 49 11.5 44 14 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
</svg>
